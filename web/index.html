<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArchRadar 3D — Spatial Architecture Studio</title>
    <style>
        :root {
            --bg: #07090e;
            --panel: rgba(13, 17, 23, 0.88);
            --border: rgba(48, 54, 61, 0.65);
            --text: #f0f6fc;
            --muted: #8b949e;
            --primary: #38bdf8;
            --critical: #f85149;
            --warning: #d29922;
            --info: #a371f7;
            --success: #3fb950;
            --cpp: #60a5fa;
            --dart: #00d2b8;
            --csharp: #a78bfa;
            --python: #fbbf24;
            --js: #f43f5e;
            --other: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #webgl-container {
            width: 100%;
            height: 100%;
            position: absolute;
            inset: 0;
            z-index: 1;
        }

        /* Top Header */
        header {
            position: absolute;
            top: 14px;
            left: 14px;
            right: 14px;
            height: 52px;
            background: var(--panel);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 14px;
            z-index: 10;
            gap: 12px;
        }
        .brand { display: flex; align-items: center; gap: 10px; }
        .brand h1 { font-size: 15px; font-weight: 700; letter-spacing: -0.3px; color: #fff; }
        .score-tag {
            font-size: 12px;
            font-weight: 700;
            padding: 3px 9px;
            border-radius: 6px;
            background: rgba(248, 81, 73, 0.15);
            color: var(--critical);
            border: 1px solid rgba(248, 81, 73, 0.3);
        }

        .mode-tabs {
            display: flex;
            background: rgba(0, 0, 0, 0.4);
            padding: 3px;
            border-radius: 7px;
            border: 1px solid var(--border);
            gap: 2px;
        }
        .mode-btn {
            background: none;
            border: none;
            color: var(--muted);
            font-size: 12px;
            padding: 5px 12px;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.15s;
        }
        .mode-btn.active, .mode-btn:hover {
            background: var(--primary);
            color: #07090e;
            font-weight: 600;
        }

        .actions { display: flex; align-items: center; gap: 8px; }
        .btn-icon {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            color: var(--text);
            font-size: 12px;
            padding: 6px 11px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.15s;
        }
        .btn-icon:hover { border-color: var(--primary); color: var(--primary); }
        .btn-icon.active { background: rgba(56, 189, 248, 0.2); border-color: var(--primary); color: var(--primary); }

        /* Left Navigation & Tree Drawer */
        .drawer-left {
            position: absolute;
            top: 76px;
            left: 14px;
            bottom: 16px;
            width: 330px;
            background: var(--panel);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 10px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            transition: transform 0.25s ease;
        }
        .drawer-left.collapsed { transform: translateX(-350px); }
        .drawer-nav {
            display: flex;
            border-bottom: 1px solid var(--border);
            padding: 4px;
            gap: 4px;
            background: rgba(0, 0, 0, 0.2);
        }
        .nav-tab {
            flex: 1;
            padding: 6px 0;
            font-size: 11px;
            font-weight: 600;
            text-align: center;
            background: none;
            border: none;
            color: var(--muted);
            cursor: pointer;
            border-radius: 5px;
        }
        .nav-tab.active { background: rgba(255, 255, 255, 0.08); color: #fff; }

        .search-box {
            padding: 8px 10px;
            border-bottom: 1px solid rgba(48, 54, 61, 0.35);
        }
        .search-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 6px 9px;
            color: var(--text);
            font-size: 12px;
            outline: none;
        }
        .search-input:focus { border-color: var(--primary); }

        /* Language Badges Filter */
        .lang-bar {
            display: flex;
            gap: 4px;
            padding: 6px 10px;
            overflow-x: auto;
            border-bottom: 1px solid rgba(48, 54, 61, 0.35);
        }
        .lang-chip {
            font-size: 10px;
            padding: 2px 7px;
            border-radius: 4px;
            cursor: pointer;
            border: 1px solid transparent;
            color: var(--muted);
            background: rgba(0,0,0,0.3);
            white-space: nowrap;
        }
        .lang-chip.active { font-weight: 700; color: #fff; border-color: currentColor; }

        .drawer-content {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        /* Tree View */
        .tree-node {
            font-size: 12px;
            padding: 3px 6px;
            cursor: pointer;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--muted);
        }
        .tree-node:hover { background: rgba(255, 255, 255, 0.05); color: #fff; }
        .tree-node.active { background: rgba(56, 189, 248, 0.15); color: var(--primary); font-weight: 600; }
        .tree-badge { font-size: 9px; padding: 1px 5px; border-radius: 3px; font-weight: 700; margin-left: auto; }

        /* Issue Card */
        .issue-card {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px 10px;
            cursor: pointer;
            margin-bottom: 6px;
            transition: all 0.15s;
        }
        .issue-card:hover, .issue-card.active { border-color: var(--primary); background: rgba(56, 189, 248, 0.08); }
        .issue-card.CRITICAL { border-left: 3px solid var(--critical); }
        .issue-card.WARNING { border-left: 3px solid var(--warning); }
        .issue-card.INFO { border-left: 3px solid var(--info); }
        .card-tag { font-size: 9px; font-weight: 700; text-transform: uppercase; margin-bottom: 2px; }
        .CRITICAL .card-tag { color: var(--critical); }
        .WARNING .card-tag { color: var(--warning); }
        .INFO .card-tag { color: var(--info); }
        .card-title { font-size: 12px; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-desc { font-size: 11px; color: var(--muted); margin-top: 2px; line-height: 1.35; }

        /* Right Inspector */
        .drawer-right {
            position: absolute;
            top: 76px;
            right: 14px;
            bottom: 16px;
            width: 320px;
            background: var(--panel);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 10px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            padding: 14px;
            transition: transform 0.25s ease;
            overflow-y: auto;
        }
        .drawer-right.collapsed { transform: translateX(340px); }
        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin: 10px 0;
        }
        .stat-box {
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid var(--border);
            border-radius: 5px;
            padding: 7px 8px;
        }
        .stat-box .val { font-size: 14px; font-weight: 700; color: var(--primary); }
        .stat-box .lbl { font-size: 10px; color: var(--muted); }

        .dep-section { margin-top: 10px; }
        .dep-title { font-size: 11px; font-weight: 600; color: var(--muted); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.4px; }
        .dep-list { display: flex; flex-wrap: wrap; gap: 4px; max-height: 120px; overflow-y: auto; }
        .dep-chip {
            font-size: 11px;
            padding: 3px 7px;
            border-radius: 4px;
            background: rgba(56, 189, 248, 0.12);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: var(--text);
            cursor: pointer;
        }
        .dep-chip.in { background: rgba(63, 185, 80, 0.12); border-color: rgba(63, 185, 80, 0.35); }
        .dep-chip:hover { border-color: #fff; }

        .panel-toggle-left {
            position: absolute;
            top: 76px;
            left: 14px;
            z-index: 15;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--muted);
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: left 0.25s ease;
        }
        .panel-toggle-left.open { left: 352px; }

        /* Floating 3D HUD / Legend */
        .hud-legend {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 6px 14px;
            display: flex;
            gap: 12px;
            align-items: center;
            z-index: 5;
            backdrop-filter: blur(12px);
        }
        .legend-item { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); }
        .legend-dot { width: 8px; height: 8px; border-radius: 50%; }

        #tooltip {
            position: absolute;
            display: none;
            background: rgba(13, 17, 23, 0.96);
            border: 1px solid var(--primary);
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 11px;
            pointer-events: none;
            z-index: 100;
        }
    </style>
    <script src="vendor/three.min.js"></script>
    <script src="vendor/OrbitControls.js"></script>
    <script src="data.js"></script>
</head>
<body>

<div id="webgl-container"></div>

<header>
    <div class="brand">
        <h1>ArchRadar 3D</h1>
        <span class="score-tag" id="scoreTag">-- / 100</span>
    </div>

    <div class="mode-tabs">
        <button class="mode-btn active" id="btnCity" onclick="setMode('CITY')">🏢 Kod Shahri</button>
        <button class="mode-btn" id="btnLayer" onclick="setMode('LAYER')">🥞 Qatlamlar Oqimi</button>
        <button class="mode-btn" id="btnGalaxy" onclick="setMode('GALAXY')">🌌 Galaktika</button>
        <button class="mode-btn" id="btnMicro" onclick="setMode('MICRO')">⚙️ Funksiyalar</button>
    </div>

    <div class="actions">
        <button class="btn-icon active" id="btnFlowToggle" onclick="toggleFlowAnimation()">🌊 Oqim Animatsiyasi</button>
        <button class="btn-icon" onclick="flyNextCycle()">⚡ Halqa</button>
        <button class="btn-icon" onclick="flyNextClone()">🧬 Dublikat</button>
        <button class="btn-icon" onclick="resetCam()">🎥 Umumiy</button>
        <label class="btn-icon" style="cursor: pointer;">
            Binar Yuklash
            <input type="file" id="filePicker" accept=".bin" style="display: none;">
        </label>
    </div>
</header>

<div class="drawer-left" id="drawerLeft">
    <div class="drawer-nav">
        <button class="nav-tab active" id="tabTree" onclick="switchLeftTab('TREE')">📁 Papka & Tillar</button>
        <button class="nav-tab" id="tabIssues" onclick="switchLeftTab('ISSUES')">⚠️ Muammolar</button>
    </div>

    <div class="search-box">
        <input class="search-input" id="searchInput" type="text" placeholder="Fayl yoki modul qidirish...">
    </div>

    <div class="lang-bar" id="langBar">
        <span class="lang-chip active" onclick="filterByLang('ALL', this)">Barchasi</span>
        <span class="lang-chip" onclick="filterByLang('cpp', this)" style="color:var(--cpp)">C/C++</span>
        <span class="lang-chip" onclick="filterByLang('dart', this)" style="color:var(--dart)">Dart / Flutter</span>
        <span class="lang-chip" onclick="filterByLang('cs', this)" style="color:var(--csharp)">C#</span>
        <span class="lang-chip" onclick="filterByLang('python', this)" style="color:var(--python)">Python</span>
    </div>

    <div class="drawer-content" id="drawerContent"></div>
</div>
<div class="panel-toggle-left open" id="toggleLeftBtn" onclick="toggleLeftDrawer()">◀</div>

<div class="drawer-right collapsed" id="drawerRight">
    <div style="display: flex; justify-content: space-between; align-items: center; padding-bottom: 8px; border-bottom: 1px solid var(--border);">
        <span style="font-size: 13px; font-weight: 600;">Obyekt Ko'rsatkichlari</span>
        <span style="cursor: pointer; color: var(--muted);" onclick="toggleRightDrawer()">✕</span>
    </div>
    <div id="inspectorBody" style="font-size: 12px; color: var(--muted); margin-top: 10px;">
        Fazodagi istalgan binoni bosing.
    </div>
</div>

<div class="hud-legend">
    <div class="legend-item"><div class="legend-dot" style="background:var(--dart)"></div>Dart / UI</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--cpp)"></div>C++ Core</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--csharp)"></div>C# Plugins</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--critical)"></div>Sikl / Xato</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--info)"></div>Dublikat</div>
</div>

<div id="tooltip"></div>

<script>
let appData = null;
let currentMode = 'CITY';
let activeLeftTab = 'TREE';
let selectedLang = 'ALL';
let searchQuery = '';
let flowAnimationActive = true;

const LANG_COLORS = {
    'cpp': 0x60a5fa,
    'hpp': 0x60a5fa,
    'h': 0x60a5fa,
    'cc': 0x60a5fa,
    'c': 0x60a5fa,
    'dart': 0x00d2b8,
    'cs': 0xa78bfa,
    'py': 0xfbbf24,
    'js': 0xf43f5e,
    'ts': 0x38bdf8
};

function getLanguage(filename) {
    if (!filename || !filename.includes('.')) return 'other';
    const ext = filename.substring(filename.lastIndexOf('.') + 1).toLowerCase();
    if (['cpp', 'hpp', 'h', 'cc', 'c'].includes(ext)) return 'cpp';
    if (ext === 'dart') return 'dart';
    if (ext === 'cs') return 'cs';
    if (ext === 'py') return 'python';
    if (['js', 'ts'].includes(ext)) return 'js';
    return 'other';
}

function getLangColorHex(filename) {
    const l = getLanguage(filename);
    if (l === 'cpp') return 0x60a5fa;
    if (l === 'dart') return 0x00d2b8;
    if (l === 'cs') return 0xa78bfa;
    if (l === 'python') return 0xfbbf24;
    if (l === 'js') return 0xf43f5e;
    return 0x94a3b8;
}

let scene, camera, renderer, controls;
let cityGroup, beamGroup, selectBeamGroup, particlesGroup;
let clickableObjects = [];
let meshMap = new Map();
let nodeById = new Map();
let raycaster, mouse;
let cycleIndex = 0;
let cloneIndex = 0;
let flowCurves = [];

// LANG_COLORS already defined above

function unpackBinary(arrayBuffer) {
    const view = new DataView(arrayBuffer);
    let off = 0;

    const magic = String.fromCharCode(view.getUint8(off++), view.getUint8(off++), view.getUint8(off++), view.getUint8(off++));
    if (magic !== 'ARCH') throw new Error('Invalid magic');

    const version = view.getUint16(off, true); off += 2;
    const health = view.getFloat32(off, true); off += 4;
    const nodeCount = view.getUint32(off, true); off += 4;
    const edgeCount = view.getUint32(off, true); off += 4;
    const issueCount = view.getUint32(off, true); off += 4;
    const strTableSize = view.getUint32(off, true); off += 4;

    const strBytes = new Uint8Array(arrayBuffer, off, strTableSize);
    off += strTableSize;
    const decoder = new TextDecoder('utf-8');

    function getStr(offset) {
        if (offset >= strTableSize) return "";
        let end = offset;
        while (end < strTableSize && strBytes[end] !== 0) end++;
        return decoder.decode(strBytes.subarray(offset, end));
    }

    const nodes = [];
    for (let i = 0; i < nodeCount; i++) {
        const idOff = view.getUint32(off, true); off += 4;
        const nameOff = view.getUint32(off, true); off += 4;
        const typeCode = view.getUint8(off); off += 1;
        const modOff = view.getUint32(off, true); off += 4;
        const fileOff = view.getUint32(off, true); off += 4;
        const loc = view.getUint32(off, true); off += 4;
        let lineStart = 0, lineEnd = 0, blastRadius = 0;
        if (version >= 2) {
            lineStart = view.getUint16(off, true); off += 2;
            lineEnd = view.getUint16(off, true); off += 2;
        }
        const comp = view.getUint16(off, true); off += 2;
        const inDeg = view.getUint16(off, true); off += 2;
        const outDeg = view.getUint16(off, true); off += 2;
        if (version >= 2) {
            blastRadius = view.getUint16(off, true); off += 2;
        }
        const inst = view.getFloat32(off, true); off += 4;
        const pr = view.getFloat32(off, true); off += 4;
        const flags = view.getUint8(off); off += 1;

        const name = getStr(nameOff);
        nodes.push({
            id: getStr(idOff),
            name: name,
            type: typeCode === 0 ? "module" : (typeCode === 1 ? "file" : "function"),
            module: getStr(modOff),
            file_path: getStr(fileOff),
            lang: getLanguage(name),
            loc,
            line_start: lineStart,
            line_end: lineEnd,
            complexity: comp,
            in_degree: inDeg,
            out_degree: outDeg,
            blast_radius: blastRadius,
            instability: inst,
            pagerank: pr,
            has_cycle: Boolean(flags & (1 << 0)),
            is_god: Boolean(flags & (1 << 1)),
            is_clone: Boolean(flags & (1 << 2)),
            is_pass_through: Boolean(flags & (1 << 3)),
            is_layer_violation: Boolean(flags & (1 << 4)),
            is_orphan: Boolean(flags & (1 << 5))
        });
    }

    const edges = [];
    for (let i = 0; i < edgeCount; i++) {
        const srcIdx = view.getUint32(off, true); off += 4;
        const tgtIdx = view.getUint32(off, true); off += 4;
        const typeCode = view.getUint8(off); off += 1;
        off += 2; // weight
        edges.push({
            source: srcIdx < nodeCount ? nodes[srcIdx].id : "",
            target: tgtIdx < nodeCount ? nodes[tgtIdx].id : "",
            type: typeCode === 0 ? "imports" : (typeCode === 1 ? "calls" : "contains")
        });
    }

    const issues = [];
    for (let i = 0; i < issueCount; i++) {
        const idOff = view.getUint32(off, true); off += 4;
        const typeOff = view.getUint32(off, true); off += 4;
        const sevCode = view.getUint8(off); off += 1;
        const titleOff = view.getUint32(off, true); off += 4;
        const descOff = view.getUint32(off, true); off += 4;
        const recomOff = view.getUint32(off, true); off += 4;
        const invCount = view.getUint16(off, true); off += 2;

        const inv = [];
        for (let k = 0; k < invCount; k++) {
            const idx = view.getUint32(off, true); off += 4;
            if (idx < nodeCount) inv.push(nodes[idx].id);
        }

        issues.push({
            id: getStr(idOff),
            type: getStr(typeOff),
            severity: sevCode === 2 ? "CRITICAL" : (sevCode === 1 ? "WARNING" : "INFO"),
            title: getStr(titleOff),
            description: getStr(descOff),
            recommendation: getStr(recomOff),
            involved_nodes: inv
        });
    }

    return { health, nodes, edges, issues };
}

function initThree() {
    const container = document.getElementById('webgl-container');
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x07090e);
    scene.fog = new THREE.FogExp2(0x07090e, 0.00045);

    camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 40000);
    camera.position.set(0, 1400, 2200);

    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    container.appendChild(renderer.domElement);

    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxPolarAngle = Math.PI / 2 - 0.01;

    scene.add(new THREE.AmbientLight(0xffffff, 0.75));
    const d1 = new THREE.DirectionalLight(0x38bdf8, 0.9);
    d1.position.set(400, 1000, 400);
    scene.add(d1);

    cityGroup = new THREE.Group();
    beamGroup = new THREE.Group();
    selectBeamGroup = new THREE.Group();
    particlesGroup = new THREE.Group();
    scene.add(cityGroup);
    scene.add(beamGroup);
    scene.add(selectBeamGroup);
    scene.add(particlesGroup);

    const grid = new THREE.GridHelper(12000, 120, 0x161b22, 0x0d1117);
    grid.position.y = -1;
    scene.add(grid);

    raycaster = new THREE.Raycaster();
    mouse = new THREE.Vector2();

    // Particle flow pool
    const particleCount = 200;
    const pGeom = new THREE.BufferGeometry();
    const pPos = new Float32Array(particleCount * 3);
    pGeom.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
    const pMat = new THREE.PointsMaterial({ color: 0x38bdf8, size: 5, transparent: true, opacity: 0.85 });
    const pPoints = new THREE.Points(pGeom, pMat);
    particlesGroup.add(pPoints);

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    renderer.domElement.addEventListener('mousemove', onMove);
    renderer.domElement.addEventListener('click', onClick);

    function animate() {
        requestAnimationFrame(animate);
        controls.update();

        // Animate flow particles along curves
        if (flowAnimationActive && flowCurves.length > 0) {
            const positions = pGeom.attributes.position.array;
            for (let i = 0; i < particleCount; i++) {
                const cIdx = i % flowCurves.length;
                const item = flowCurves[cIdx];
                item.progress = (item.progress + 0.004) % 1.0;
                const pt = item.curve.getPoint(item.progress);
                positions[i * 3] = pt.x;
                positions[i * 3 + 1] = pt.y;
                positions[i * 3 + 2] = pt.z;
            }
            pGeom.attributes.position.needsUpdate = true;
        }

        renderer.render(scene, camera);
    }

    animate();
}

function clearGroup(g) {
    while (g.children.length > 0) g.remove(g.children[0]);
}

function onMove(e) {
    mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

    raycaster.setFromCamera(mouse, camera);
    const hits = raycaster.intersectObjects(clickableObjects);
    const tip = document.getElementById('tooltip');

    if (hits.length > 0 && hits[0].object.userData.name) {
        const u = hits[0].object.userData;
        tip.style.display = 'block';
        tip.style.left = (e.clientX + 14) + 'px';
        tip.style.top = (e.clientY + 14) + 'px';
        tip.innerHTML = `<strong>${u.name}</strong> · ${u.loc || 0} qator<br><span style="color:var(--muted)">${u.module || ''}</span>`;
        renderer.domElement.style.cursor = 'pointer';
    } else {
        tip.style.display = 'none';
        renderer.domElement.style.cursor = 'default';
    }
}

function onClick() {
    raycaster.setFromCamera(mouse, camera);
    const hits = raycaster.intersectObjects(clickableObjects);
    if (hits.length > 0 && hits[0].object.userData) {
        showInspector(hits[0].object.userData, hits[0].object);
    }
}

function resolveMeshForNode(nodeId) {
    if (meshMap.has(nodeId)) return meshMap.get(nodeId);
    const n = nodeById.get(nodeId);
    if (n && n.type === 'function') {
        const fId = 'file:' + n.file_path;
        if (meshMap.has(fId)) return meshMap.get(fId);
    }
    return null;
}

function drawArc(p1, p2, hex, targetGroup = beamGroup, opacity = 0.8, registerFlow = false) {
    if (!p1 || !p2 || p1.distanceTo(p2) < 2) return null;
    const mx = (p1.x + p2.x) / 2;
    const mz = (p1.z + p2.z) / 2;
    const my = Math.max(p1.y, p2.y) + Math.min(260, Math.hypot(p2.x - p1.x, p2.z - p1.z) * 0.35 + 30);

    const curve = new THREE.QuadraticBezierCurve3(
        new THREE.Vector3(p1.x, p1.y, p1.z),
        new THREE.Vector3(mx, my, mz),
        new THREE.Vector3(p2.x, p2.y, p2.z)
    );
    const line = new THREE.Line(
        new THREE.BufferGeometry().setFromPoints(curve.getPoints(24)),
        new THREE.LineBasicMaterial({ color: hex, transparent: true, opacity })
    );
    targetGroup.add(line);

    if (registerFlow) {
        flowCurves.push({ curve, color: hex, progress: Math.random() });
    }
    return line;
}

/* 1. CODE CITY MODE: Modules as Islands, separated by Language districts */
function buildCity(data) {
    clearGroup(cityGroup);
    clearGroup(beamGroup);
    clearGroup(selectBeamGroup);
    clickableObjects = [];
    meshMap.clear();
    flowCurves = [];

    // Group files by module
    const modules = {};
    const files = data.nodes.filter(n => n.type === 'file');
    files.forEach(n => {
        if (selectedLang !== 'ALL' && n.lang !== selectedLang) return;
        const m = n.module || 'root';
        if (!modules[m]) modules[m] = [];
        modules[m].push(n);
    });

    // Calculate sizes per module to allocate spacious islands
    const keys = Object.keys(modules);
    const modSizes = {};
    const modCols = {};
    const modPlatSizes = {};

    keys.forEach(m => {
        const cnt = modules[m].length;
        const inCols = Math.ceil(Math.sqrt(cnt));
        modCols[m] = inCols;
        // 56px per building cell + 80px border padding
        modPlatSizes[m] = Math.max(320, inCols * 56 + 80);
    });

    // Arrange islands with generous spacing (min 280px gap between island edges)
    const islandGap = 320;
    const gridCols = Math.ceil(Math.sqrt(keys.length));
    
    // Calculate row heights and column widths
    const colWidths = new Array(gridCols).fill(0);
    const rowHeights = new Array(Math.ceil(keys.length / gridCols)).fill(0);

    keys.forEach((m, idx) => {
        const c = idx % gridCols;
        const r = Math.floor(idx / gridCols);
        const sz = modPlatSizes[m];
        if (sz > colWidths[c]) colWidths[c] = sz;
        if (sz > rowHeights[r]) rowHeights[r] = sz;
    });

    const colOffsets = [];
    let curX = 0;
    for (let c = 0; c < gridCols; c++) {
        colOffsets.push(curX + colWidths[c] / 2);
        curX += colWidths[c] + islandGap;
    }
    const totalW = curX - islandGap;

    const rowOffsets = [];
    let curZ = 0;
    for (let r = 0; r < rowHeights.length; r++) {
        rowOffsets.push(curZ + rowHeights[r] / 2);
        curZ += rowHeights[r] + islandGap;
    }
    const totalH = curZ - islandGap;

    keys.forEach((modName, mIdx) => {
        const c = mIdx % gridCols;
        const r = Math.floor(mIdx / gridCols);
        const dx = colOffsets[c] - totalW / 2;
        const dz = rowOffsets[r] - totalH / 2;

        const fList = modules[modName];
        const inCols = modCols[modName];
        const pSize = modPlatSizes[modName];

        // Island Base Platform (dark with subtle cyan/purple border)
        const plat = new THREE.Mesh(
            new THREE.BoxGeometry(pSize, 6, pSize),
            new THREE.MeshStandardMaterial({ 
                color: 0x0c111a, 
                roughness: 0.85, 
                metalness: 0.2
            })
        );
        plat.position.set(dx, 3, dz);
        cityGroup.add(plat);

        // Island Border Wireframe for distinct visual boundaries
        const borderGeom = new THREE.EdgesGeometry(new THREE.BoxGeometry(pSize, 6.2, pSize));
        const borderLine = new THREE.LineSegments(borderGeom, new THREE.LineBasicMaterial({ color: 0x223249, transparent: true, opacity: 0.8 }));
        borderLine.position.set(dx, 3, dz);
        cityGroup.add(borderLine);

        // Buildings arranged with 56px pitch (24px width + 32px open street space)
        fList.forEach((f, fIdx) => {
            const fr = Math.floor(fIdx / inCols);
            const fc = fIdx % inCols;
            const startX = dx - (pSize / 2) + 40 + 12;
            const startZ = dz - (pSize / 2) + 40 + 12;
            const bx = startX + (fc * 56);
            const bz = startZ + (fr * 56);
            const bh = Math.max(16, Math.min(320, (f.loc || 20) * 0.38));

            let color = getLangColorHex(f.name);
            if (f.has_cycle || f.is_layer_violation) color = 0xf85149;
            else if (f.is_god) color = 0xd29922;
            else if (f.is_clone) color = 0xa371f7;

            const bldg = new THREE.Mesh(
                new THREE.BoxGeometry(24, bh, 24),
                new THREE.MeshStandardMaterial({
                    color,
                    roughness: 0.25,
                    metalness: 0.5,
                    emissive: (f.has_cycle || f.is_clone) ? color : 0x000000,
                    emissiveIntensity: f.has_cycle ? 0.4 : (f.is_clone ? 0.3 : 0)
                })
            );
            bldg.position.set(bx, bh / 2 + 6, bz);
            bldg.userData = f;
            cityGroup.add(bldg);
            clickableObjects.push(bldg);
            meshMap.set(f.id, bldg);
        });
    });

    // Draw active flow beams between modules/files
    data.edges.filter(e => e.type === 'imports').slice(0, 200).forEach(e => {
        const s = meshMap.get(e.source);
        const t = meshMap.get(e.target);
        if (s && t) drawArc(s.position, t.position, 0x38bdf8, beamGroup, 0.22, true);
    });

    // Cycle arcs
    data.issues.filter(i => i.type === 'CIRCULAR_DEPENDENCY').forEach(iss => {
        for (let i = 0; i + 1 < iss.involved_nodes.length; i++) {
            const s = resolveMeshForNode(iss.involved_nodes[i]);
            const t = resolveMeshForNode(iss.involved_nodes[i + 1]);
            if (s && t) drawArc(s.position, t.position, 0xf85149, beamGroup, 0.85, true);
        }
    });
}

/* 2. LAYER FLOW MODE: Clean Architecture Tiers (Apps -> Services -> Core) */
function buildLayerFlow(data) {
    clearGroup(cityGroup);
    clearGroup(beamGroup);
    clearGroup(selectBeamGroup);
    clickableObjects = [];
    meshMap.clear();
    flowCurves = [];

    const files = data.nodes.filter(n => n.type === 'file');
    
    // Assign 3 horizontal elevation layers
    const getLayerY = (mod) => {
        if (mod.includes('core')) return 40;            // Foundation (Ground)
        if (mod.includes('api') || mod.includes('plugin')) return 240; // Mid tier
        return 440;                                    // Apps / UI tier (Top)
    };

    const layerTiers = { 40: [], 240: [], 440: [] };
    files.forEach(f => {
        const y = getLayerY(f.module);
        layerTiers[y].push(f);
    });

    [40, 240, 440].forEach(tierY => {
        const list = layerTiers[tierY];
        const cols = Math.ceil(Math.sqrt(Math.max(1, list.length)));
        const pSize = Math.max(300, cols * 38 + 50);

        // Semi-transparent tier plane
        const plane = new THREE.Mesh(
            new THREE.BoxGeometry(pSize, 3, pSize),
            new THREE.MeshStandardMaterial({
                color: tierY === 40 ? 0x1e3a8a : (tierY === 240 ? 0x065f46 : 0x4c1d95),
                transparent: true,
                opacity: 0.4
            })
        );
        plane.position.set(0, tierY - 4, 0);
        cityGroup.add(plane);

        list.forEach((f, i) => {
            const r = Math.floor(i / cols);
            const c = i % cols;
            const x = (c - cols / 2) * 36;
            const z = (r - cols / 2) * 36;
            const bh = Math.max(12, Math.min(100, (f.loc || 20) * 0.25));

            const col = getLangColorHex(f.name);
            const bldg = new THREE.Mesh(
                new THREE.BoxGeometry(18, bh, 18),
                new THREE.MeshStandardMaterial({ color: f.has_cycle ? 0xf85149 : col, roughness: 0.3 })
            );
            bldg.position.set(x, tierY + bh / 2, z);
            bldg.userData = f;
            cityGroup.add(bldg);
            clickableObjects.push(bldg);
            meshMap.set(f.id, bldg);
        });
    });

    // Cross-layer calls
    data.edges.filter(e => e.type === 'imports').slice(0, 250).forEach(e => {
        const s = meshMap.get(e.source);
        const t = meshMap.get(e.target);
        if (s && t) {
            const isViolation = s.position.y < t.position.y; // Lower layer importing upper!
            drawArc(s.position, t.position, isViolation ? 0xf85149 : 0x38bdf8, beamGroup, isViolation ? 0.9 : 0.3, true);
        }
    });
}

/* 3. GALAXY MODE: Force-directed Topological Ring */
function buildGalaxy(data) {
    clearGroup(cityGroup);
    clearGroup(beamGroup);
    clearGroup(selectBeamGroup);
    clickableObjects = [];
    meshMap.clear();
    flowCurves = [];

    const files = data.nodes.filter(n => n.type === 'file');
    const rad = 500;
    files.forEach((f, i) => {
        const phi = Math.acos(-1 + (2 * i) / Math.max(1, files.length));
        const theta = Math.sqrt(files.length * Math.PI) * phi;
        const x = rad * Math.cos(theta) * Math.sin(phi);
        const y = rad * Math.sin(theta) * Math.sin(phi) + 300;
        const z = rad * Math.cos(phi);

        const col = f.has_cycle ? 0xf85149 : getLangColorHex(f.name);
        const sp = new THREE.Mesh(
            new THREE.SphereGeometry(f.has_cycle || f.is_god ? 11 : 7, 12, 12),
            new THREE.MeshStandardMaterial({ color: col, emissive: f.has_cycle ? col : 0x000000, emissiveIntensity: 0.3 })
        );
        sp.position.set(x, y, z);
        sp.userData = f;
        cityGroup.add(sp);
        clickableObjects.push(sp);
        meshMap.set(f.id, sp);
    });

    data.edges.filter(e => e.type === 'imports').slice(0, 220).forEach(e => {
        const s = meshMap.get(e.source), t = meshMap.get(e.target);
        if (s && t) drawArc(s.position, t.position, 0x38bdf8, beamGroup, 0.25, true);
    });
}

/* 4. FUNCTION MICRO MODE: Subroutines, Clones & Pass-throughs */
function buildMicro(data) {
    clearGroup(cityGroup);
    clearGroup(beamGroup);
    clearGroup(selectBeamGroup);
    clickableObjects = [];
    meshMap.clear();
    flowCurves = [];

    const fns = data.nodes
        .filter(n => n.type === 'function')
        .sort((a, b) => ((b.is_clone ? 1000 : 0) + b.complexity) - ((a.is_clone ? 1000 : 0) + a.complexity))
        .slice(0, 600);

    const cols = Math.ceil(Math.sqrt(Math.max(1, fns.length)));
    fns.forEach((fn, i) => {
        const r = Math.floor(i / cols);
        const c = i % cols;
        const x = (c - cols / 2) * 36;
        const z = (r - cols / 2) * 36;
        const h = Math.max(6, Math.min(220, (fn.loc || 5) * 1.5));

        let col = 0x3fb950;
        if (fn.is_clone) col = 0xa371f7;
        else if (fn.is_pass_through) col = 0x38bdf8;
        else if (fn.complexity > 10) col = 0xd29922;

        const cyl = new THREE.Mesh(
            new THREE.CylinderGeometry(6, 6, h, 8),
            new THREE.MeshStandardMaterial({
                color: col,
                emissive: fn.is_clone ? 0xa371f7 : 0x000000,
                emissiveIntensity: fn.is_clone ? 0.4 : 0
            })
        );
        cyl.position.set(x, h / 2, z);
        cyl.userData = fn;
        cityGroup.add(cyl);
        clickableObjects.push(cyl);
        meshMap.set(fn.id, cyl);
    });

    data.issues.filter(i => i.type === 'CODE_DUPLICATION').forEach(iss => {
        if (iss.involved_nodes.length >= 2) {
            const s = meshMap.get(iss.involved_nodes[0]);
            const t = meshMap.get(iss.involved_nodes[1]);
            if (s && t) drawArc(s.position, t.position, 0xa371f7, beamGroup, 0.9, true);
        }
    });
}

function showInspector(u, mesh) {
    const drawer = document.getElementById('drawerRight');
    drawer.classList.remove('collapsed');

    clearGroup(selectBeamGroup);

    const outDeps = [];
    const inDeps = [];
    appData.edges.forEach(e => {
        if (e.type === 'contains') return;
        if (e.source === u.id && nodeById.has(e.target)) outDeps.push(nodeById.get(e.target));
        if (e.target === u.id && nodeById.has(e.source)) inDeps.push(nodeById.get(e.source));
    });

    if (mesh) {
        outDeps.slice(0, 25).forEach(tNode => {
            const tm = resolveMeshForNode(tNode.id);
            if (tm) drawArc(mesh.position, tm.position, 0x38bdf8, selectBeamGroup, 0.95);
        });
        inDeps.slice(0, 25).forEach(sNode => {
            const sm = resolveMeshForNode(sNode.id);
            if (sm) drawArc(sm.position, mesh.position, 0x3fb950, selectBeamGroup, 0.9);
        });
    }

    const relIssues = appData.issues.filter(iss =>
        iss.involved_nodes.some(nid => nid === u.id || (u.type === 'file' && nid.startsWith('fn:' + u.file_path + ':')))
    );

    const locLine = u.line_start ? `${u.file_path}:${u.line_start}-${u.line_end}` : (u.file_path || u.module);

    const chips = (arr, cls) => arr.slice(0, 12).map(n =>
        `<span class="dep-chip ${cls}" onclick="jumpToNode('${n.id.replace(/'/g, "\\'")}')">${n.name}</span>`
    ).join('') || '<span style="color:var(--muted);font-size:11px;">Yo\'q</span>';

    const issHtml = relIssues.slice(0, 6).map(iss =>
        `<div style="margin-top:6px;padding:6px 8px;background:rgba(248,81,73,0.12);border-left:2px solid var(--${iss.severity === 'CRITICAL' ? 'critical' : (iss.severity === 'WARNING' ? 'warning' : 'info')});border-radius:4px;font-size:11px;">
            <strong>${iss.title}</strong><div style="color:var(--muted);margin-top:2px;">${iss.description}</div>
        </div>`
    ).join('');

    document.getElementById('inspectorBody').innerHTML = `
        <div style="font-weight: 700; color: #fff; font-size: 14px; word-break: break-word;">${u.name}</div>
        <div style="color: var(--muted); font-size: 11px; margin-top: 2px; word-break: break-all;">${locLine}</div>

        <div class="stat-grid">
            <div class="stat-box"><div class="val">${u.loc || 0}</div><div class="lbl">Qatorlar (LOC)</div></div>
            <div class="stat-box"><div class="val">${u.complexity || 1}</div><div class="lbl">Murakkablik</div></div>
            <div class="stat-box"><div class="val">${u.in_degree} / ${u.out_degree}</div><div class="lbl">Ca / Ce</div></div>
            <div class="stat-box"><div class="val">${u.blast_radius || 0}</div><div class="lbl">Ta'sir (Blast)</div></div>
        </div>

        <div class="dep-section">
            <div class="dep-title">Tashqariga chaqiradi (${outDeps.length})</div>
            <div class="dep-list">${chips(outDeps, '')}</div>
        </div>
        <div class="dep-section">
            <div class="dep-title">Bunga bog'langan (${inDeps.length})</div>
            <div class="dep-list">${chips(inDeps, 'in')}</div>
        </div>
        ${issHtml}
    `;

    if (mesh) {
        flyTo(mesh.position.x, mesh.position.y + 65, mesh.position.z + 150, mesh.position);
    }
}

function jumpToNode(nodeId) {
    const m = resolveMeshForNode(nodeId);
    const n = nodeById.get(nodeId);
    if (m && n) showInspector(n, m);
}

function flyTo(x, y, z, target) {
    const sPos = camera.position.clone();
    const tPos = new THREE.Vector3(x, y, z);
    const sTar = controls.target.clone();
    const tTar = target ? new THREE.Vector3(target.x, target.y, target.z) : new THREE.Vector3(0, 0, 0);

    let p = 0;
    function f() {
        p += 0.06;
        camera.position.lerpVectors(sPos, tPos, Math.min(1, p));
        controls.target.lerpVectors(sTar, tTar, Math.min(1, p));
        if (p < 1) requestAnimationFrame(f);
    }
    f();
}

function resetCam() {
    clearGroup(selectBeamGroup);
    flyTo(0, 1400, 2200, { x: 0, y: 0, z: 0 });
}

function flyNextCycle() {
    const cycles = appData.issues.filter(i => i.type === 'CIRCULAR_DEPENDENCY');
    if (cycles.length === 0) return;
    const c = cycles[cycleIndex % cycles.length];
    cycleIndex++;
    const o = resolveMeshForNode(c.involved_nodes[0]);
    if (o) showInspector(o.userData, o);
}

function flyNextClone() {
    const clones = appData.issues.filter(i => i.type === 'CODE_DUPLICATION');
    if (clones.length === 0) return;
    const c = clones[cloneIndex % clones.length];
    cloneIndex++;
    if (currentMode !== 'MICRO') setMode('MICRO');
    const o = resolveMeshForNode(c.involved_nodes[0]);
    if (o) showInspector(o.userData, o);
}

function setMode(m) {
    currentMode = m;
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    if (m === 'CITY') document.getElementById('btnCity').classList.add('active');
    else if (m === 'LAYER') document.getElementById('btnLayer').classList.add('active');
    else if (m === 'GALAXY') document.getElementById('btnGalaxy').classList.add('active');
    else document.getElementById('btnMicro').classList.add('active');

    if (m === 'CITY') buildCity(appData);
    else if (m === 'LAYER') buildLayerFlow(appData);
    else if (m === 'GALAXY') buildGalaxy(appData);
    else buildMicro(appData);
}

function toggleFlowAnimation() {
    flowAnimationActive = !flowAnimationActive;
    const btn = document.getElementById('btnFlowToggle');
    btn.classList.toggle('active', flowAnimationActive);
    particlesGroup.visible = flowAnimationActive;
}

function filterByLang(lang, btn) {
    selectedLang = lang;
    document.querySelectorAll('.lang-chip').forEach(c => c.classList.remove('active'));
    if (btn) btn.classList.add('active');
    setMode(currentMode);
    renderLeftTab();
}

function switchLeftTab(tab) {
    activeLeftTab = tab;
    document.getElementById('tabTree').classList.toggle('active', tab === 'TREE');
    document.getElementById('tabIssues').classList.toggle('active', tab === 'ISSUES');
    renderLeftTab();
}

function renderLeftTab() {
    if (!appData) return;
    const cont = document.getElementById('drawerContent');
    cont.innerHTML = '';

    const q = searchQuery.toLowerCase();

    if (activeLeftTab === 'TREE') {
        // Group files by module
        const mods = {};
        appData.nodes.filter(n => n.type === 'file').forEach(f => {
            if (selectedLang !== 'ALL' && f.lang !== selectedLang) return;
            if (q && !f.name.toLowerCase().includes(q) && !f.module.toLowerCase().includes(q)) return;
            const m = f.module || 'root';
            if (!mods[m]) mods[m] = [];
            mods[m].push(f);
        });

        Object.keys(mods).sort().forEach(mName => {
            const fList = mods[mName];
            const mHead = document.createElement('div');
            mHead.style.cssText = 'font-weight:700;color:#fff;font-size:12px;margin:8px 0 4px;padding:4px 6px;background:rgba(255,255,255,0.04);border-radius:4px;display:flex;justify-content:space-between;';
            mHead.innerHTML = `<span>📁 ${mName}</span><span style="color:var(--muted);font-weight:normal;">${fList.length}</span>`;
            cont.appendChild(mHead);

            fList.slice(0, 40).forEach(f => {
                const el = document.createElement('div');
                el.className = 'tree-node';
                const col = f.has_cycle ? 'var(--critical)' : (f.is_clone ? 'var(--info)' : 'var(--muted)');
                el.innerHTML = `
                    <span style="color:${col}">📄</span>
                    <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${f.name}</span>
                    <span class="tree-badge" style="background:rgba(255,255,255,0.06);color:${getLangColorHex(f.name).toString(16)}">${f.lang.toUpperCase()}</span>
                `;
                el.onclick = () => {
                    const m = resolveMeshForNode(f.id);
                    if (m) showInspector(f, m);
                };
                cont.appendChild(el);
            });
        });
    } else {
        // Issues List
        const issues = appData.issues.filter(iss => {
            if (q && !iss.title.toLowerCase().includes(q) && !iss.description.toLowerCase().includes(q)) return false;
            return true;
        });

        issues.forEach(iss => {
            const item = document.createElement('div');
            item.className = `issue-card ${iss.severity}`;
            item.innerHTML = `
                <div class="card-tag">${iss.type}</div>
                <div class="card-title">${iss.title}</div>
                <div class="card-desc">${iss.description}</div>
            `;
            item.onclick = () => {
                if (iss.involved_nodes.length > 0) {
                    const o = resolveMeshForNode(iss.involved_nodes[0]);
                    const n = nodeById.get(iss.involved_nodes[0]);
                    if (o && n) showInspector(n, o);
                }
            };
            cont.appendChild(item);
        });
    }
}

function toggleLeftDrawer() {
    const d = document.getElementById('drawerLeft');
    const b = document.getElementById('toggleLeftBtn');
    d.classList.toggle('collapsed');
    b.classList.toggle('open');
    b.innerText = d.classList.contains('collapsed') ? '▶' : '◀';
}

function toggleRightDrawer() {
    document.getElementById('drawerRight').classList.toggle('collapsed');
}

function loadData(d) {
    appData = d;
    nodeById.clear();
    d.nodes.forEach(n => nodeById.set(n.id, n));

    const scoreEl = document.getElementById('scoreTag');
    scoreEl.innerText = `${Math.round(d.health)} / 100`;
    scoreEl.style.color = d.health >= 70 ? 'var(--success)' : (d.health >= 45 ? 'var(--warning)' : 'var(--critical)');

    renderLeftTab();
    setMode(currentMode);
}

initThree();

document.getElementById('searchInput').addEventListener('input', e => {
    searchQuery = e.target.value;
    renderLeftTab();
});

if (window.ARCH_BINARY_B64) {
    try {
        const bin = atob(window.ARCH_BINARY_B64);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        loadData(unpackBinary(bytes.buffer));
    } catch (e) {
        console.error(e);
    }
}

document.getElementById('filePicker').addEventListener('change', e => {
    const f = e.target.files[0];
    if (f) {
        const r = new FileReader();
        r.onload = ev => loadData(unpackBinary(ev.target.result));
        r.readAsArrayBuffer(f);
    }
});
</script>
</body>
</html>
