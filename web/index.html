<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArchRadar 3D</title>
    <style>
        :root {
            --bg: #07090e;
            --panel: rgba(13, 17, 23, 0.88);
            --border: rgba(48, 54, 61, 0.65);
            --text: #f0f6fc;
            --muted: #8b949e;
            --primary: #38bdf8;
            --critical: #f85149;
            --warning: #d29922;
            --info: #a371f7;
            --success: #3fb950;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #webgl-container {
            width: 100%;
            height: 100%;
            position: absolute;
            inset: 0;
            z-index: 1;
        }

        header {
            position: absolute;
            top: 14px;
            left: 14px;
            right: 14px;
            height: 50px;
            background: var(--panel);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 14px;
            z-index: 10;
            gap: 12px;
        }
        .brand { display: flex; align-items: center; gap: 10px; }
        .brand h1 { font-size: 15px; font-weight: 700; letter-spacing: -0.3px; color: #fff; }
        .score-tag {
            font-size: 12px;
            font-weight: 700;
            padding: 3px 9px;
            border-radius: 6px;
            background: rgba(248, 81, 73, 0.15);
            color: var(--critical);
            border: 1px solid rgba(248, 81, 73, 0.3);
        }

        .mode-tabs {
            display: flex;
            background: rgba(0, 0, 0, 0.4);
            padding: 3px;
            border-radius: 7px;
            border: 1px solid var(--border);
            gap: 2px;
        }
        .mode-btn {
            background: none;
            border: none;
            color: var(--muted);
            font-size: 12px;
            padding: 5px 12px;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.15s;
        }
        .mode-btn.active, .mode-btn:hover {
            background: var(--primary);
            color: #07090e;
            font-weight: 600;
        }

        .actions { display: flex; align-items: center; gap: 8px; }
        .btn-icon {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            color: var(--text);
            font-size: 12px;
            padding: 6px 11px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.15s;
        }
        .btn-icon:hover { border-color: var(--primary); color: var(--primary); }

        .drawer-left {
            position: absolute;
            top: 74px;
            left: 14px;
            bottom: 16px;
            width: 326px;
            background: var(--panel);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 10px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            transition: transform 0.25s ease;
        }
        .drawer-left.collapsed { transform: translateX(-346px); }
        .drawer-head {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: 600;
        }
        .filter-bar {
            padding: 8px 10px 4px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            border-bottom: 1px solid rgba(48, 54, 61, 0.35);
        }
        .search-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 6px 9px;
            color: var(--text);
            font-size: 12px;
            outline: none;
            user-select: text;
        }
        .search-input:focus { border-color: var(--primary); }
        .filter-pills { display: flex; gap: 4px; flex-wrap: wrap; padding-bottom: 4px; }
        .pill {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            color: var(--muted);
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 12px;
            cursor: pointer;
        }
        .pill.active {
            background: rgba(56, 189, 248, 0.16);
            border-color: var(--primary);
            color: var(--primary);
            font-weight: 600;
        }

        .issues-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .issue-card {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px 10px;
            cursor: pointer;
            transition: all 0.15s;
        }
        .issue-card:hover, .issue-card.active {
            border-color: var(--primary);
            background: rgba(56, 189, 248, 0.08);
        }
        .issue-card.CRITICAL { border-left: 3px solid var(--critical); }
        .issue-card.WARNING { border-left: 3px solid var(--warning); }
        .issue-card.INFO { border-left: 3px solid var(--info); }
        .card-tag { font-size: 9px; font-weight: 700; text-transform: uppercase; margin-bottom: 2px; }
        .CRITICAL .card-tag { color: var(--critical); }
        .WARNING .card-tag { color: var(--warning); }
        .INFO .card-tag { color: var(--info); }
        .card-title { font-size: 12px; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-desc { font-size: 11px; color: var(--muted); margin-top: 2px; line-height: 1.35; }

        .drawer-right {
            position: absolute;
            top: 74px;
            right: 14px;
            bottom: 16px;
            width: 300px;
            background: var(--panel);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 10px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            padding: 12px;
            transition: transform 0.25s ease;
            overflow-y: auto;
        }
        .drawer-right.collapsed { transform: translateX(320px); }
        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin: 10px 0;
        }
        .stat-box {
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid var(--border);
            border-radius: 5px;
            padding: 7px 8px;
        }
        .stat-box .val { font-size: 14px; font-weight: 700; color: var(--primary); }
        .stat-box .lbl { font-size: 10px; color: var(--muted); }

        .dep-section { margin-top: 10px; }
        .dep-title { font-size: 11px; font-weight: 600; color: var(--muted); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.4px; }
        .dep-list { display: flex; flex-wrap: wrap; gap: 4px; max-height: 120px; overflow-y: auto; }
        .dep-chip {
            font-size: 11px;
            padding: 3px 7px;
            border-radius: 4px;
            background: rgba(56, 189, 248, 0.12);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: var(--text);
            cursor: pointer;
        }
        .dep-chip.in { background: rgba(63, 185, 80, 0.12); border-color: rgba(63, 185, 80, 0.35); }
        .dep-chip.clone { background: rgba(163, 113, 247, 0.16); border-color: rgba(163, 113, 247, 0.45); }
        .dep-chip:hover { border-color: #fff; }

        .panel-toggle-left {
            position: absolute;
            top: 74px;
            left: 14px;
            z-index: 15;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--muted);
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: left 0.25s ease;
        }
        .panel-toggle-left.open { left: 348px; }

        #tooltip {
            position: absolute;
            display: none;
            background: rgba(13, 17, 23, 0.96);
            border: 1px solid var(--primary);
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 11px;
            pointer-events: none;
            z-index: 100;
        }
    </style>
    <script src="vendor/three.min.js"></script>
    <script src="vendor/OrbitControls.js"></script>
    <script src="data.js"></script>
</head>
<body>

<div id="webgl-container"></div>

<header>
    <div class="brand">
        <h1>ArchRadar 3D</h1>
        <span class="score-tag" id="scoreTag">-- / 100</span>
    </div>

    <div class="mode-tabs">
        <button class="mode-btn active" id="btnCity" onclick="setMode('CITY')">Code City</button>
        <button class="mode-btn" id="btnUniverse" onclick="setMode('UNIVERSE')">Topologik Oqim</button>
        <button class="mode-btn" id="btnMicro" onclick="setMode('MICRO')">Funksiyalar</button>
    </div>

    <div class="actions">
        <button class="btn-icon" onclick="flyNextCycle()">⚡ Halqa</button>
        <button class="btn-icon" onclick="flyNextClone()">🧬 Dublikat</button>
        <button class="btn-icon" onclick="resetCam()">🎥 Umumiy</button>
        <label class="btn-icon" style="cursor: pointer;">
            Binar Yuklash
            <input type="file" id="filePicker" accept=".bin" style="display: none;">
        </label>
    </div>
</header>

<div class="drawer-left" id="drawerLeft">
    <div class="drawer-head">
        <span>Muammolar</span>
        <span id="issueCount" style="color: var(--muted); font-size: 12px;">0 ta</span>
    </div>
    <div class="filter-bar">
        <input class="search-input" id="searchInput" type="text" placeholder="Fayl, funksiya yoki muammo qidirish...">
        <div class="filter-pills">
            <button class="pill active" onclick="setFilter('ALL', this)">Barchasi</button>
            <button class="pill" onclick="setFilter('CIRCULAR_DEPENDENCY', this)">Halqalar</button>
            <button class="pill" onclick="setFilter('CODE_DUPLICATION', this)">Dublikatlar</button>
            <button class="pill" onclick="setFilter('OTHER', this)">God / Qatlam</button>
        </div>
    </div>
    <div class="issues-scroll" id="issuesList"></div>
</div>
<div class="panel-toggle-left open" id="toggleLeftBtn" onclick="toggleLeftDrawer()">◀</div>

<div class="drawer-right collapsed" id="drawerRight">
    <div style="display: flex; justify-content: space-between; align-items: center; padding-bottom: 8px; border-bottom: 1px solid var(--border);">
        <span style="font-size: 13px; font-weight: 600;">Ko'rsatkichlar</span>
        <span style="cursor: pointer; color: var(--muted);" onclick="toggleRightDrawer()">✕</span>
    </div>
    <div id="inspectorBody" style="font-size: 12px; color: var(--muted); margin-top: 10px;">
        Fazodagi istalgan obyektni bosing.
    </div>
</div>

<div id="tooltip"></div>

<script>
let appData = null;
let currentMode = 'CITY';
let currentFilter = 'ALL';
let searchQuery = '';
let scene, camera, renderer, controls;
let cityGroup, beamGroup, selectBeamGroup;
let clickableObjects = [];
let meshMap = new Map();
let nodeById = new Map();
let raycaster, mouse;
let cycleIndex = 0;
let cloneIndex = 0;

function unpackBinary(arrayBuffer) {
    const view = new DataView(arrayBuffer);
    let off = 0;

    const magic = String.fromCharCode(view.getUint8(off++), view.getUint8(off++), view.getUint8(off++), view.getUint8(off++));
    if (magic !== 'ARCH') throw new Error('Invalid magic');

    const version = view.getUint16(off, true); off += 2;
    const health = view.getFloat32(off, true); off += 4;
    const nodeCount = view.getUint32(off, true); off += 4;
    const edgeCount = view.getUint32(off, true); off += 4;
    const issueCount = view.getUint32(off, true); off += 4;
    const strTableSize = view.getUint32(off, true); off += 4;

    const strBytes = new Uint8Array(arrayBuffer, off, strTableSize);
    off += strTableSize;
    const decoder = new TextDecoder('utf-8');

    function getStr(offset) {
        if (offset >= strTableSize) return "";
        let end = offset;
        while (end < strTableSize && strBytes[end] !== 0) end++;
        return decoder.decode(strBytes.subarray(offset, end));
    }

    const nodes = [];
    for (let i = 0; i < nodeCount; i++) {
        const idOff = view.getUint32(off, true); off += 4;
        const nameOff = view.getUint32(off, true); off += 4;
        const typeCode = view.getUint8(off); off += 1;
        const modOff = view.getUint32(off, true); off += 4;
        const fileOff = view.getUint32(off, true); off += 4;
        const loc = view.getUint32(off, true); off += 4;
        let lineStart = 0, lineEnd = 0, blastRadius = 0;
        if (version >= 2) {
            lineStart = view.getUint16(off, true); off += 2;
            lineEnd = view.getUint16(off, true); off += 2;
        }
        const comp = view.getUint16(off, true); off += 2;
        const inDeg = view.getUint16(off, true); off += 2;
        const outDeg = view.getUint16(off, true); off += 2;
        if (version >= 2) {
            blastRadius = view.getUint16(off, true); off += 2;
        }
        const inst = view.getFloat32(off, true); off += 4;
        const pr = view.getFloat32(off, true); off += 4;
        const flags = view.getUint8(off); off += 1;

        nodes.push({
            id: getStr(idOff),
            name: getStr(nameOff),
            type: typeCode === 0 ? "module" : (typeCode === 1 ? "file" : "function"),
            module: getStr(modOff),
            file_path: getStr(fileOff),
            loc,
            line_start: lineStart,
            line_end: lineEnd,
            complexity: comp,
            in_degree: inDeg,
            out_degree: outDeg,
            blast_radius: blastRadius,
            instability: inst,
            pagerank: pr,
            has_cycle: Boolean(flags & (1 << 0)),
            is_god: Boolean(flags & (1 << 1)),
            is_clone: Boolean(flags & (1 << 2)),
            is_pass_through: Boolean(flags & (1 << 3)),
            is_layer_violation: Boolean(flags & (1 << 4)),
            is_orphan: Boolean(flags & (1 << 5))
        });
    }

    const edges = [];
    for (let i = 0; i < edgeCount; i++) {
        const srcIdx = view.getUint32(off, true); off += 4;
        const tgtIdx = view.getUint32(off, true); off += 4;
        const typeCode = view.getUint8(off); off += 1;
        off += 2; // weight
        edges.push({
            source: srcIdx < nodeCount ? nodes[srcIdx].id : "",
            target: tgtIdx < nodeCount ? nodes[tgtIdx].id : "",
            type: typeCode === 0 ? "imports" : (typeCode === 1 ? "calls" : "contains")
        });
    }

    const issues = [];
    for (let i = 0; i < issueCount; i++) {
        const idOff = view.getUint32(off, true); off += 4;
        const typeOff = view.getUint32(off, true); off += 4;
        const sevCode = view.getUint8(off); off += 1;
        const titleOff = view.getUint32(off, true); off += 4;
        const descOff = view.getUint32(off, true); off += 4;
        const recomOff = view.getUint32(off, true); off += 4;
        const invCount = view.getUint16(off, true); off += 2;

        const inv = [];
        for (let k = 0; k < invCount; k++) {
            const idx = view.getUint32(off, true); off += 4;
            if (idx < nodeCount) inv.push(nodes[idx].id);
        }

        issues.push({
            id: getStr(idOff),
            type: getStr(typeOff),
            severity: sevCode === 2 ? "CRITICAL" : (sevCode === 1 ? "WARNING" : "INFO"),
            title: getStr(titleOff),
            description: getStr(descOff),
            recommendation: getStr(recomOff),
            involved_nodes: inv
        });
    }

    return { health, nodes, edges, issues };
}

function initThree() {
    const container = document.getElementById('webgl-container');
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x07090e);
    scene.fog = new THREE.FogExp2(0x07090e, 0.00055);

    camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 20000);
    camera.position.set(0, 650, 950);

    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    container.appendChild(renderer.domElement);

    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxPolarAngle = Math.PI / 2 - 0.01;

    scene.add(new THREE.AmbientLight(0xffffff, 0.72));
    const d1 = new THREE.DirectionalLight(0x38bdf8, 0.85);
    d1.position.set(300, 800, 300);
    scene.add(d1);

    cityGroup = new THREE.Group();
    beamGroup = new THREE.Group();
    selectBeamGroup = new THREE.Group();
    scene.add(cityGroup);
    scene.add(beamGroup);
    scene.add(selectBeamGroup);

    const grid = new THREE.GridHelper(5000, 80, 0x161b22, 0x0d1117);
    grid.position.y = -1;
    scene.add(grid);

    raycaster = new THREE.Raycaster();
    mouse = new THREE.Vector2();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    renderer.domElement.addEventListener('mousemove', onMove);
    renderer.domElement.addEventListener('click', onClick);
    animate();
}

function clearGroup(g) {
    while (g.children.length > 0) g.remove(g.children[0]);
}

function onMove(e) {
    mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

    raycaster.setFromCamera(mouse, camera);
    const hits = raycaster.intersectObjects(clickableObjects);
    const tip = document.getElementById('tooltip');

    if (hits.length > 0 && hits[0].object.userData.name) {
        const u = hits[0].object.userData;
        tip.style.display = 'block';
        tip.style.left = (e.clientX + 14) + 'px';
        tip.style.top = (e.clientY + 14) + 'px';
        tip.innerHTML = `<strong>${u.name}</strong> · ${u.loc || 0} qator`;
        renderer.domElement.style.cursor = 'pointer';
    } else {
        tip.style.display = 'none';
        renderer.domElement.style.cursor = 'default';
    }
}

function onClick() {
    raycaster.setFromCamera(mouse, camera);
    const hits = raycaster.intersectObjects(clickableObjects);
    if (hits.length > 0 && hits[0].object.userData) {
        showInspector(hits[0].object.userData, hits[0].object);
    }
}

function resolveMeshForNode(nodeId) {
    if (meshMap.has(nodeId)) return meshMap.get(nodeId);
    const n = nodeById.get(nodeId);
    if (n && n.type === 'function') {
        const fId = 'file:' + n.file_path;
        if (meshMap.has(fId)) return meshMap.get(fId);
    }
    return null;
}

function drawArc(p1, p2, hex, targetGroup = beamGroup, opacity = 0.8) {
    if (!p1 || !p2 || p1.distanceTo(p2) < 1) return;
    const mx = (p1.x + p2.x) / 2;
    const mz = (p1.z + p2.z) / 2;
    const my = Math.max(p1.y, p2.y) + Math.min(220, Math.hypot(p2.x - p1.x, p2.z - p1.z) * 0.35 + 25);

    const curve = new THREE.QuadraticBezierCurve3(
        new THREE.Vector3(p1.x, p1.y, p1.z),
        new THREE.Vector3(mx, my, mz),
        new THREE.Vector3(p2.x, p2.y, p2.z)
    );
    const line = new THREE.Line(
        new THREE.BufferGeometry().setFromPoints(curve.getPoints(24)),
        new THREE.LineBasicMaterial({ color: hex, transparent: true, opacity })
    );
    targetGroup.add(line);
}

function buildCity(data) {
    clearGroup(cityGroup);
    clearGroup(beamGroup);
    clearGroup(selectBeamGroup);
    clickableObjects = [];
    meshMap.clear();

    const modules = {};
    const files = data.nodes.filter(n => n.type === 'file');
    files.forEach(n => {
        const m = n.module || 'root';
        if (!modules[m]) modules[m] = [];
        modules[m].push(n);
    });

    const keys = Object.keys(modules);
    const cols = Math.ceil(Math.sqrt(keys.length));
    const spacing = 380;

    keys.forEach((modName, mIdx) => {
        const row = Math.floor(mIdx / cols);
        const col = mIdx % cols;
        const dx = (col - cols / 2) * spacing;
        const dz = (row - cols / 2) * spacing;

        const fList = modules[modName];
        const inCols = Math.ceil(Math.sqrt(fList.length));
        const pSize = Math.max(180, inCols * 32 + 30);

        const plat = new THREE.Mesh(
            new THREE.BoxGeometry(pSize, 2, pSize),
            new THREE.MeshStandardMaterial({ color: 0x0d1117, roughness: 0.9 })
        );
        plat.position.set(dx, 1, dz);
        cityGroup.add(plat);

        fList.forEach((f, fIdx) => {
            const fr = Math.floor(fIdx / inCols);
            const fc = fIdx % inCols;
            const bx = dx - (pSize / 2) + 24 + (fc * 30);
            const bz = dz - (pSize / 2) + 24 + (fr * 30);
            const bh = Math.max(12, Math.min(280, (f.loc || 20) * 0.35));

            let color = 0x38bdf8;
            if (f.has_cycle || f.is_layer_violation) color = 0xf85149;
            else if (f.is_god) color = 0xd29922;
            else if (f.is_clone) color = 0xa371f7;

            const bldg = new THREE.Mesh(
                new THREE.BoxGeometry(18, bh, 18),
                new THREE.MeshStandardMaterial({
                    color,
                    roughness: 0.3,
                    metalness: 0.5,
                    emissive: (f.has_cycle || f.is_clone) ? color : 0x000000,
                    emissiveIntensity: (f.has_cycle || f.is_clone) ? 0.25 : 0
                })
            );
            bldg.position.set(bx, bh / 2 + 2, bz);
            bldg.userData = f;
            cityGroup.add(bldg);
            clickableObjects.push(bldg);
            meshMap.set(f.id, bldg);
        });
    });

    // Cycle & Clone arcs
    data.issues.filter(i => i.type === 'CIRCULAR_DEPENDENCY').forEach(iss => {
        for (let i = 0; i + 1 < iss.involved_nodes.length; i++) {
            const s = resolveMeshForNode(iss.involved_nodes[i]);
            const t = resolveMeshForNode(iss.involved_nodes[i + 1]);
            if (s && t) drawArc(s.position, t.position, 0xf85149, beamGroup, 0.75);
        }
    });
    data.issues.filter(i => i.type === 'CODE_DUPLICATION').forEach(iss => {
        if (iss.involved_nodes.length >= 2) {
            const s = resolveMeshForNode(iss.involved_nodes[0]);
            const t = resolveMeshForNode(iss.involved_nodes[1]);
            if (s && t) drawArc(s.position, t.position, 0xa371f7, beamGroup, 0.55);
        }
    });
}

function buildUniverse(data) {
    clearGroup(cityGroup);
    clearGroup(beamGroup);
    clearGroup(selectBeamGroup);
    clickableObjects = [];
    meshMap.clear();

    const files = data.nodes.filter(n => n.type === 'file');
    const rad = 460;
    files.forEach((f, i) => {
        const phi = Math.acos(-1 + (2 * i) / Math.max(1, files.length));
        const theta = Math.sqrt(files.length * Math.PI) * phi;
        const x = rad * Math.cos(theta) * Math.sin(phi);
        const y = rad * Math.sin(theta) * Math.sin(phi) + 250;
        const z = rad * Math.cos(phi);

        const col = f.has_cycle ? 0xf85149 : (f.is_god ? 0xd29922 : 0x38bdf8);
        const sp = new THREE.Mesh(
            new THREE.SphereGeometry(f.has_cycle || f.is_god ? 10 : 6, 12, 12),
            new THREE.MeshStandardMaterial({ color: col, emissive: f.has_cycle ? col : 0x000000, emissiveIntensity: 0.3 })
        );
        sp.position.set(x, y, z);
        sp.userData = f;
        cityGroup.add(sp);
        clickableObjects.push(sp);
        meshMap.set(f.id, sp);
    });

    // Show sample dependency links
    data.edges.filter(e => e.type === 'imports').slice(0, 220).forEach(e => {
        const s = meshMap.get(e.source), t = meshMap.get(e.target);
        if (s && t) drawArc(s.position, t.position, 0x38bdf8, beamGroup, 0.2);
    });
}

function buildMicro(data) {
    clearGroup(cityGroup);
    clearGroup(beamGroup);
    clearGroup(selectBeamGroup);
    clickableObjects = [];
    meshMap.clear();

    // Prioritize functions with clones, pass-throughs, or high complexity so issues are always visible
    const fns = data.nodes
        .filter(n => n.type === 'function')
        .sort((a, b) => ((b.is_clone ? 1000 : 0) + b.complexity) - ((a.is_clone ? 1000 : 0) + a.complexity))
        .slice(0, 500);

    const cols = Math.ceil(Math.sqrt(Math.max(1, fns.length)));
    fns.forEach((fn, i) => {
        const r = Math.floor(i / cols);
        const c = i % cols;
        const x = (c - cols / 2) * 36;
        const z = (r - cols / 2) * 36;
        const h = Math.max(6, Math.min(200, (fn.loc || 5) * 1.4));

        let col = 0x3fb950;
        if (fn.is_clone) col = 0xa371f7;
        else if (fn.is_pass_through) col = 0x38bdf8;
        else if (fn.complexity > 10) col = 0xd29922;

        const cyl = new THREE.Mesh(
            new THREE.CylinderGeometry(6, 6, h, 8),
            new THREE.MeshStandardMaterial({
                color: col,
                emissive: fn.is_clone ? 0xa371f7 : 0x000000,
                emissiveIntensity: fn.is_clone ? 0.35 : 0
            })
        );
        cyl.position.set(x, h / 2, z);
        cyl.userData = fn;
        cityGroup.add(cyl);
        clickableObjects.push(cyl);
        meshMap.set(fn.id, cyl);
    });

    // Draw clone arcs between duplicate functions
    data.issues.filter(i => i.type === 'CODE_DUPLICATION').forEach(iss => {
        if (iss.involved_nodes.length >= 2) {
            const s = meshMap.get(iss.involved_nodes[0]);
            const t = meshMap.get(iss.involved_nodes[1]);
            if (s && t) drawArc(s.position, t.position, 0xa371f7, beamGroup, 0.85);
        }
    });
}

function showInspector(u, mesh) {
    const drawer = document.getElementById('drawerRight');
    drawer.classList.remove('collapsed');

    clearGroup(selectBeamGroup);

    // Find outgoing & incoming dependencies
    const outDeps = [];
    const inDeps = [];
    appData.edges.forEach(e => {
        if (e.type === 'contains') return;
        if (e.source === u.id && nodeById.has(e.target)) outDeps.push(nodeById.get(e.target));
        if (e.target === u.id && nodeById.has(e.source)) inDeps.push(nodeById.get(e.source));
    });

    // Draw 3D selection arcs
    if (mesh) {
        outDeps.slice(0, 25).forEach(tNode => {
            const tm = resolveMeshForNode(tNode.id);
            if (tm) drawArc(mesh.position, tm.position, 0x38bdf8, selectBeamGroup, 0.95);
        });
        inDeps.slice(0, 25).forEach(sNode => {
            const sm = resolveMeshForNode(sNode.id);
            if (sm) drawArc(sm.position, mesh.position, 0x3fb950, selectBeamGroup, 0.9);
        });
    }

    // Find issues involving this node (or functions inside this file)
    const relIssues = appData.issues.filter(iss =>
        iss.involved_nodes.some(nid => nid === u.id || (u.type === 'file' && nid.startsWith('fn:' + u.file_path + ':')))
    );

    const locLine = u.line_start ? `${u.file_path}:${u.line_start}-${u.line_end}` : (u.file_path || u.module);

    const chips = (arr, cls) => arr.slice(0, 12).map(n =>
        `<span class="dep-chip ${cls}" onclick="jumpToNode('${n.id.replace(/'/g, "\\'")}')">${n.name}</span>`
    ).join('') || '<span style="color:var(--muted);font-size:11px;">Yo\'q</span>';

    const issHtml = relIssues.slice(0, 6).map(iss =>
        `<div style="margin-top:6px;padding:6px 8px;background:rgba(248,81,73,0.12);border-left:2px solid var(--${iss.severity === 'CRITICAL' ? 'critical' : (iss.severity === 'WARNING' ? 'warning' : 'info')});border-radius:4px;font-size:11px;">
            <strong>${iss.title}</strong><div style="color:var(--muted);margin-top:2px;">${iss.description}</div>
        </div>`
    ).join('');

    document.getElementById('inspectorBody').innerHTML = `
        <div style="font-weight: 700; color: #fff; font-size: 14px; word-break: break-word;">${u.name}</div>
        <div style="color: var(--muted); font-size: 11px; margin-top: 2px; word-break: break-all;">${locLine}</div>

        <div class="stat-grid">
            <div class="stat-box"><div class="val">${u.loc || 0}</div><div class="lbl">Qatorlar (LOC)</div></div>
            <div class="stat-box"><div class="val">${u.complexity || 1}</div><div class="lbl">Murakkablik</div></div>
            <div class="stat-box"><div class="val">${u.in_degree} / ${u.out_degree}</div><div class="lbl">Ca / Ce</div></div>
            <div class="stat-box"><div class="val">${u.blast_radius || 0}</div><div class="lbl">Ta'sir (Blast)</div></div>
        </div>

        <div class="dep-section">
            <div class="dep-title">Tashqariga bog'liq (${outDeps.length})</div>
            <div class="dep-list">${chips(outDeps, '')}</div>
        </div>
        <div class="dep-section">
            <div class="dep-title">Bunga bog'langan (${inDeps.length})</div>
            <div class="dep-list">${chips(inDeps, 'in')}</div>
        </div>
        ${issHtml}
    `;

    if (mesh) {
        flyTo(mesh.position.x, mesh.position.y + 65, mesh.position.z + 150, mesh.position);
    }
}

function jumpToNode(nodeId) {
    const m = resolveMeshForNode(nodeId);
    const n = nodeById.get(nodeId);
    if (m && n) showInspector(n, m);
}

function flyTo(x, y, z, target) {
    const sPos = camera.position.clone();
    const tPos = new THREE.Vector3(x, y, z);
    const sTar = controls.target.clone();
    const tTar = target ? new THREE.Vector3(target.x, target.y, target.z) : new THREE.Vector3(0, 0, 0);

    let p = 0;
    function f() {
        p += 0.06;
        camera.position.lerpVectors(sPos, tPos, Math.min(1, p));
        controls.target.lerpVectors(sTar, tTar, Math.min(1, p));
        if (p < 1) requestAnimationFrame(f);
    }
    f();
}

function resetCam() {
    clearGroup(selectBeamGroup);
    flyTo(0, 650, 950, { x: 0, y: 0, z: 0 });
}

function flyNextCycle() {
    const cycles = appData.issues.filter(i => i.type === 'CIRCULAR_DEPENDENCY');
    if (cycles.length === 0) return;
    const c = cycles[cycleIndex % cycles.length];
    cycleIndex++;
    const o = resolveMeshForNode(c.involved_nodes[0]);
    if (o) showInspector(o.userData, o);
}

function flyNextClone() {
    const clones = appData.issues.filter(i => i.type === 'CODE_DUPLICATION');
    if (clones.length === 0) return;
    const c = clones[cloneIndex % clones.length];
    cloneIndex++;
    if (currentMode !== 'MICRO') setMode('MICRO');
    const o = resolveMeshForNode(c.involved_nodes[0]);
    if (o) showInspector(o.userData, o);
}

function setMode(m) {
    currentMode = m;
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    if (m === 'CITY') document.getElementById('btnCity').classList.add('active');
    else if (m === 'UNIVERSE') document.getElementById('btnUniverse').classList.add('active');
    else document.getElementById('btnMicro').classList.add('active');

    if (m === 'CITY') buildCity(appData);
    else if (m === 'UNIVERSE') buildUniverse(appData);
    else buildMicro(appData);
}

function setFilter(f, btn) {
    currentFilter = f;
    document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
    if (btn) btn.classList.add('active');
    renderIssuesList();
}

function renderIssuesList() {
    if (!appData) return;
    const list = document.getElementById('issuesList');
    list.innerHTML = '';

    const q = searchQuery.toLowerCase();
    const filtered = appData.issues.filter(iss => {
        if (currentFilter === 'CIRCULAR_DEPENDENCY' && iss.type !== 'CIRCULAR_DEPENDENCY') return false;
        if (currentFilter === 'CODE_DUPLICATION' && iss.type !== 'CODE_DUPLICATION') return false;
        if (currentFilter === 'OTHER' && (iss.type === 'CIRCULAR_DEPENDENCY' || iss.type === 'CODE_DUPLICATION')) return false;
        if (q && !(iss.title.toLowerCase().includes(q) || iss.description.toLowerCase().includes(q))) return false;
        return true;
    });

    document.getElementById('issueCount').innerText = `${filtered.length} ta`;
    filtered.forEach(iss => {
        const item = document.createElement('div');
        item.className = `issue-card ${iss.severity}`;
        item.innerHTML = `
            <div class="card-tag">${iss.type}</div>
            <div class="card-title">${iss.title}</div>
            <div class="card-desc">${iss.description}</div>
        `;
        item.onclick = () => {
            document.querySelectorAll('.issue-card').forEach(c => c.classList.remove('active'));
            item.classList.add('active');
            if (iss.type === 'CODE_DUPLICATION' && currentMode !== 'MICRO') {
                setMode('MICRO');
            }
            if (iss.involved_nodes.length > 0) {
                const o = resolveMeshForNode(iss.involved_nodes[0]);
                const n = nodeById.get(iss.involved_nodes[0]);
                if (o && n) showInspector(n, o);
                if (iss.involved_nodes.length >= 2) {
                    const m1 = resolveMeshForNode(iss.involved_nodes[0]);
                    const m2 = resolveMeshForNode(iss.involved_nodes[1]);
                    if (m1 && m2) drawArc(m1.position, m2.position, 0xa371f7, selectBeamGroup, 1.0);
                }
            }
        };
        list.appendChild(item);
    });
}

function toggleLeftDrawer() {
    const d = document.getElementById('drawerLeft');
    const b = document.getElementById('toggleLeftBtn');
    d.classList.toggle('collapsed');
    b.classList.toggle('open');
    b.innerText = d.classList.contains('collapsed') ? '▶' : '◀';
}

function toggleRightDrawer() {
    document.getElementById('drawerRight').classList.toggle('collapsed');
}

function loadData(d) {
    appData = d;
    nodeById.clear();
    d.nodes.forEach(n => nodeById.set(n.id, n));

    const scoreEl = document.getElementById('scoreTag');
    scoreEl.innerText = `${Math.round(d.health)} / 100`;
    scoreEl.style.color = d.health >= 70 ? 'var(--success)' : (d.health >= 45 ? 'var(--warning)' : 'var(--critical)');

    renderIssuesList();
    setMode(currentMode);
}

function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
}

initThree();

document.getElementById('searchInput').addEventListener('input', e => {
    searchQuery = e.target.value;
    renderIssuesList();
});

if (window.ARCH_BINARY_B64) {
    try {
        const bin = atob(window.ARCH_BINARY_B64);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        loadData(unpackBinary(bytes.buffer));
    } catch (e) {
        console.error(e);
    }
}

document.getElementById('filePicker').addEventListener('change', e => {
    const f = e.target.files[0];
    if (f) {
        const r = new FileReader();
        r.onload = ev => loadData(unpackBinary(ev.target.result));
        r.readAsArrayBuffer(f);
    }
});
</script>
</body>
</html>
